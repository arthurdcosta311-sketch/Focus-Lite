name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Archive
        run: |
          xcodebuild \
            -project "Focus Lite.xcodeproj" \
            -scheme "Focus Lite" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FocusLite.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/FocusLite.xcarchive/Products/Applications/Focus Lite.app" Payload/
          zip -qry FocusLite.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLite-ipa
          path: FocusLite.ipa
          if-no-files-found: error