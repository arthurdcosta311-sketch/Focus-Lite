name: Build IPA

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Archive
        run: |
          xcodebuild \
            -project "Focus Lite.xcodeproj" \
            -scheme "Focus Lite" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FocusLite.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/FocusLite.xcarchive/Products/Applications/Focus Lite.app" Payload/
          zip -qry FocusLite.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLite-ipa${{ steps.channel.outputs.suffix }}
          path: FocusLite.ipa
          if-no-files-found: error

      - name: Read app version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c \
            "Print :CFBundleShortVersionString" \
            "build/FocusLite.xcarchive/Products/Applications/Focus Lite.app/Info.plist")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release channel
        id: channel
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "body=Unsigned Release IPA built from main. Re-sign it with your own certificate to install on a device." >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-preview" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "body=Unsigned Release IPA built from the preview branch. Re-sign it with your own certificate to install on a device." >> "$GITHUB_OUTPUT"
          fi

      - name: Attach IPA to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}${{ steps.channel.outputs.suffix }}
          name: Focus Lite v${{ steps.version.outputs.version }}${{ steps.channel.outputs.suffix }}
          body: ${{ steps.channel.outputs.body }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: FocusLite.ipa
          fail_on_unmatched_files: true